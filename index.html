<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Proyectos - Smith.R</title>
  <style>
    :root {
      --bg-dark: #0a0a0f;
      --card-bg: #13131c;
      --card-border: #222230;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --green-primary: #10b981;
      --green-glow: #059669;
      --purple-neon: #a855f7;
      --purple-glow: rgba(168, 85, 247, 0.35);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background-color: var(--bg-dark);
      color: var(--text-main);
      min-height: 100vh;
      padding: 2rem 1rem;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .container {
      width: 100%;
      max-width: 900px;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 2.5rem;
      padding-bottom: 1rem;
      border-bottom: 1px solid rgba(168, 85, 247, 0.2);
    }

    .titles h1 {
      font-size: 2.5rem;
      text-transform: uppercase;
      letter-spacing: 2px;
      color: var(--text-main);
      text-shadow: 0 0 10px rgba(255, 255, 255, 0.2);
    }

    .titles h2 {
      font-size: 1.2rem;
      color: var(--purple-neon);
      font-weight: 500;
      text-shadow: 0 0 8px var(--purple-glow);
    }

    .btn-add {
      width: 55px;
      height: 55px;
      border-radius: 50%;
      background-color: var(--green-primary);
      color: #000;
      border: none;
      font-size: 2rem;
      font-weight: bold;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 0 15px var(--green-glow), 0 0 25px rgba(16, 185, 129, 0.4);
      transition: all 0.3s ease;
    }

    .btn-add:hover {
      transform: scale(1.1) rotate(90deg);
      box-shadow: 0 0 20px var(--green-primary), 0 0 35px var(--purple-neon);
    }

    .projects-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 1.5rem;
    }

    .project-card {
      background-color: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      padding: 1.5rem;
      position: relative;
      overflow: hidden;
      transition: transform 0.3s ease, border-color 0.3s ease, box-shadow 0.3s ease;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .project-card::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 3px;
      background: linear-gradient(90deg, var(--green-primary), var(--purple-neon));
    }

    .project-card:hover {
      transform: translateY(-5px);
      border-color: var(--purple-neon);
      box-shadow: 0 8px 25px var(--purple-glow);
    }

    .project-card h3 {
      font-size: 1.3rem;
      margin-bottom: 0.5rem;
      color: var(--text-main);
    }

    .project-card p {
      color: var(--text-muted);
      font-size: 0.95rem;
      line-height: 1.4;
      margin-bottom: 1rem;
      white-space: pre-line;
    }

    .attachments-preview {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: auto;
      padding-top: 1rem;
    }

    .img-preview {
      width: 100%;
      max-height: 150px;
      object-fit: cover;
      border-radius: 6px;
      border: 1px solid var(--purple-neon);
      margin-bottom: 0.5rem;
    }

    .file-chip {
      background-color: rgba(168, 85, 247, 0.15);
      border: 1px solid var(--purple-neon);
      color: var(--text-main);
      padding: 4px 10px;
      border-radius: 20px;
      font-size: 0.8rem;
      text-decoration: none;
      display: inline-block;
      max-width: 100%;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .btn-delete {
      position: absolute;
      top: 10px;
      right: 10px;
      background: none;
      border: none;
      color: var(--text-muted);
      cursor: pointer;
      font-size: 1.1rem;
    }

    .btn-delete:hover {
      color: #ef4444;
    }

    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.85);
      backdrop-filter: blur(5px);
      display: flex;
      justify-content: center;
      align-items: center;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s ease;
      z-index: 1000;
    }

    .modal-overlay.active {
      opacity: 1;
      pointer-events: all;
    }

    .modal {
      background-color: var(--card-bg);
      border: 1px solid var(--purple-neon);
      box-shadow: 0 0 30px var(--purple-glow);
      width: 90%;
      max-width: 500px;
      border-radius: 12px;
      padding: 2rem;
      position: relative;
    }

    .modal h2 {
      margin-bottom: 1.5rem;
      color: var(--green-primary);
    }

    .form-group {
      margin-bottom: 1.2rem;
    }

    .form-group label {
      display: block;
      margin-bottom: 0.5rem;
      color: var(--text-muted);
      font-size: 0.9rem;
    }

    .form-group input[type="text"],
    .form-group textarea {
      width: 100%;
      padding: 0.8rem;
      background-color: var(--bg-dark);
      border: 1px solid var(--card-border);
      border-radius: 6px;
      color: var(--text-main);
      outline: none;
    }

    .form-group input[type="text"]:focus,
    .form-group textarea:focus {
      border-color: var(--purple-neon);
      box-shadow: 0 0 8px var(--purple-glow);
    }

    .form-group input[type="file"] {
      display: none;
    }

    .file-upload-label {
      display: block;
      padding: 0.8rem;
      background-color: rgba(16, 185, 129, 0.1);
      border: 1px dashed var(--green-primary);
      color: var(--green-primary);
      text-align: center;
      border-radius: 6px;
      cursor: pointer;
      transition: background-color 0.3s ease;
    }

    .file-upload-label:hover {
      background-color: rgba(16, 185, 129, 0.2);
    }

    .modal-actions {
      display: flex;
      justify-content: flex-end;
      gap: 1rem;
      margin-top: 1.5rem;
    }

    .btn-cancel {
      background: none;
      border: 1px solid var(--card-border);
      color: var(--text-muted);
      padding: 0.6rem 1.2rem;
      border-radius: 6px;
      cursor: pointer;
    }

    .btn-save {
      background-color: var(--green-primary);
      color: #000;
      border: none;
      padding: 0.6rem 1.2rem;
      font-weight: bold;
      border-radius: 6px;
      cursor: pointer;
      box-shadow: 0 0 10px var(--green-glow);
    }

    .empty-state {
      text-align: center;
      grid-column: 1 / -1;
      padding: 3rem;
      color: var(--text-muted);
      border: 1px dashed var(--card-border);
      border-radius: 12px;
    }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <div class="titles">
        <h1>Proyectos</h1>
        <h2>Smith.R</h2>
      </div>
      <button class="btn-add" id="openModalBtn">+</button>
    </header>

    <main>
      <div class="projects-grid" id="projectsContainer"></div>
    </main>
  </div>
  <div class="modal-overlay" id="modalOverlay">
    <div class="modal">
      <h2>Nuevo Proyecto</h2>
      <form id="projectForm">
        <div class="form-group">
          <label for="projectTitle">Título del Proyecto</label>
          <input type="text" id="projectTitle" required placeholder="Ej: Rediseño Web">
        </div>
        <div class="form-group">
          <label for="projectDescription">Descripción / Texto</label>
          <textarea id="projectDescription" rows="4" required placeholder="Detalles del proyecto..."></textarea>
        </div>
        <div class="form-group">
          <label class="file-upload-label" for="projectFiles">📎 Adjuntar Archivos o Imágenes</label>
          <input type="file" id="projectFiles" multiple>
          <span id="fileNameDisplay" style="font-size: 0.8rem; color: var(--text-muted); display: block; margin-top: 5px;"></span>
        </div>
        <div class="modal-actions">
          <button type="button" class="btn-cancel" id="closeModalBtn">Cancelar</button>
          <button type="submit" class="btn-save">Guardar</button>
        </div>
      </form>
    </div>
  </div>

  <script>
    const openModalBtn = document.getElementById('openModalBtn');
    const closeModalBtn = document.getElementById('closeModalBtn');
    const modalOverlay = document.getElementById('modalOverlay');
    const projectForm = document.getElementById('projectForm');
    const projectsContainer = document.getElementById('projectsContainer');
    const projectFilesInput = document.getElementById('projectFiles');
    const fileNameDisplay = document.getElementById('fileNameDisplay');

    let projects = JSON.parse(localStorage.getItem('smith_projects')) || [];
    
    openModalBtn.addEventListener('click', () => modalOverlay.classList.add('active'));
    closeModalBtn.addEventListener('click', closeModal);
    modalOverlay.addEventListener('click', (e) => {
      if (e.target === modalOverlay) closeModal();
    });

    function closeModal() {
      modalOverlay.classList.remove('active');
      projectForm.reset();
      fileNameDisplay.textContent = '';
    }
    
    projectFilesInput.addEventListener('change', () => {
      const count = projectFilesInput.files.length;
      fileNameDisplay.textContent = count > 0 ? `${count} archivo(s) seleccionado(s)` : '';
    });
    
    projectForm.addEventListener('submit', async (e) => {
      e.preventDefault();

      const title = document.getElementById('projectTitle').value;
      const description = document.getElementById('projectDescription').value;
      const files = projectFilesInput.files;
    
      const processedFiles = [];
      for (let file of files) {
        const base64 = await convertBase64(file);
        processedFiles.push({
          name: file.name,
          type: file.type,
          data: base64
        });
      }
      const newProject = {
        id: Date.now(),
        title,
        description,
        files: processedFiles
      };
      projects.push(newProject);
      saveAndRender();
      closeModal();
    });
    function convertBase64(file) {
      return new Promise((resolve, reject) => {
        const fileReader = new FileReader();
        fileReader.readAsDataURL(file);
        fileReader.onload = () => resolve(fileReader.result);
        fileReader.onerror = (error) => reject(error);
      });
    }
    
    function deleteProject(id) {
      projects = projects.filter(p => p.id !== id);
      saveAndRender();
    }
    function saveAndRender() {
      localStorage.setItem('smith_projects', JSON.stringify(projects));
      renderProjects();
    }    
    function renderProjects() {
      projectsContainer.innerHTML = '';

      if (projects.length === 0) {
        projectsContainer.innerHTML = `
          <div class="empty-state">
            No tienes proyectos aún. Haz clic en el botón <strong>+</strong> para agregar uno.
          </div>
        `;
        return;
      }
      projects.forEach(project => {
        const card = document.createElement('div');
        card.className = 'project-card';
        let filesHTML = '';
        if (project.files && project.files.length > 0) {
          filesHTML = '<div class="attachments-preview">';
          project.files.forEach(file => {
            if (file.type.startsWith('image/')) {
              filesHTML += `<img src="${file.data}" alt="${file.name}" class="img-preview">`;
            } else {
              filesHTML += `<a href="${file.data}" download="${file.name}" class="file-chip">📄 ${file.name}</a>`;
            }
          });
          filesHTML += '</div>';
        }
        card.innerHTML = `
          <button class="btn-delete" onclick="deleteProject(${project.id})">&times;</button>
          <h3>${project.title}</h3>
          <p>${project.description}</p>
          ${filesHTML}
        `;
        projectsContainer.appendChild(card);
      });
    }
    renderProjects();
  </script>
</body>
</html>
