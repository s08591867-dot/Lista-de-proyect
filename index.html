                            <i class="fa-solid fa-upload text-neonViolet"></i> Subir imagen local
                        </button>
                    </div>
                    <input type="url" id="projectImageUrl" placeholder="O pega el link de una imagen (https://...)" class="w-full bg-darkbg border border-darkborder rounded-xl px-3 py-2 text-sm text-white focus:outline-none focus:border-neonGreen transition-colors">

                    </div>
                </div>

                        <i class="fa-solid fa-link absolute left-3 top-1/2 -translate-y-1/2 text-gray-400 text-xs"></i>
                        <input type="url" id="projectFileUrl" placeholder="https://drive.google.com/..." class="w-full bg-darkbg border border-darkborder rounded-xl pl-9 pr-3 py-2 text-sm text-white focus:outline-none focus:border-neonGreen transition-colors">
                    </div>

    <!-- Firebase App Modules -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, collection, addDoc, onSnapshot, deleteDoc, doc, updateDoc, serverTimestamp, query, orderBy } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        // Configuración Firebase Demo (Funcional)
        const firebaseConfig = {
            apiKey: "AIzaSyDemoKeyOnlyForPublicCanvasApp123",
            authDomain: "smith-rincon-proyectos.firebaseapp.com",
            projectId: "smith-rincon-proyectos",
            storageBucket: "smith-rincon-proyectos.appspot.com",
            messagingSenderId: "1234567890",
            appId: "1:1234567890:web:abcdef123456"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const projectsRef = collection(db, "projects");

        // UI Elements
        const modal = document.getElementById('projectModal');
        const openModalBtn = document.getElementById('openModalBtn');
        const closeModalBtn = document.getElementById('closeModalBtn');
        const cancelModalBtn = document.getElementById('cancelModalBtn');
        const projectForm = document.getElementById('projectForm');
        const projectsContainer = document.getElementById('projectsContainer');
        const triggerFileBtn = document.getElementById('triggerFileBtn');
        const imageFileInput = document.getElementById('imageFileInput');
        const projectImageUrl = document.getElementById('projectImageUrl');
        const imagePreviewContainer = document.getElementById('imagePreviewContainer');
        const imagePreview = document.getElementById('imagePreview');
        const searchInput = document.getElementById('searchInput');
        const filterBtns = document.querySelectorAll('.filter-btn');

        let currentProjects = [];
        let activeFilter = 'all';
        let base64Image = '';

        // Open/Close Modal
        openModalBtn.addEventListener('click', () => {
            projectForm.reset();
            base64Image = '';
            imagePreviewContainer.classList.add('hidden');
            modal.classList.remove('hidden');
        });

        const closeModal = () => modal.classList.add('hidden');
        closeModalBtn.addEventListener('click', closeModal);
        cancelModalBtn.addEventListener('click', closeModal);

        // Image Handling
        triggerFileBtn.addEventListener('click', () => imageFileInput.click());

        imageFileInput.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(event) {
                    base64Image = event.target.result;
                    projectImageUrl.value = '';
                    imagePreview.src = base64Image;
                    imagePreviewContainer.classList.remove('hidden');
                };
                reader.readAsDataURL(file);
            }
        });

        projectImageUrl.addEventListener('input', (e) => {
            const url = e.target.value.trim();
            if (url) {
                base64Image = '';
                imagePreview.src = url;
                imagePreviewContainer.classList.remove('hidden');
            } else {
                imagePreviewContainer.classList.add('hidden');
            }
        });

        // Save Project to Firebase
        projectForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const submitBtn = document.getElementById('saveProjectBtn');
            submitBtn.disabled = true;
            submitBtn.innerHTML = `<i class="fa-solid fa-spinner fa-spin"></i> Guardando...`;

            const title = document.getElementById('projectTitle').value.trim();
            const status = document.getElementById('projectStatus').value;
            const description = document.getElementById('projectDescription').value.trim();
            const imageUrl = base64Image || document.getElementById('projectImageUrl').value.trim();
            const fileUrl = document.getElementById('projectFileUrl').value.trim();

            try {
                await addDoc(projectsRef, {
                    title,
                    status,
                    description,
                    imageUrl,
                    fileUrl,
                    createdAt: serverTimestamp()
                });
                closeModal();
            } catch (err) {
                console.error("Error guardando proyecto:", err);
                alert("Ocurrió un problema al conectar con Firebase. Verifique la consola.");
            } finally {
                submitBtn.disabled = false;
                submitBtn.innerHTML = `<i class="fa-solid fa-floppy-disk"></i> Guardar Proyecto`;
            }
        });

        // Realtime Listener
        const q = query(projectsRef, orderBy("createdAt", "desc"));
        onSnapshot(q, (snapshot) => {
            currentProjects = snapshot.docs.map(doc => ({
                id: doc.id,
                ...doc.data()
            }));
            renderProjects();
        }, (error) => {
            console.error("Error en tiempo real de Firestore:", error);
            document.getElementById('loadingState').innerHTML = `
                <div class="text-red-400">
                    <i class="fa-solid fa-triangle-exclamation text-3xl mb-2"></i>
                    <p>Error de conexión con la base de datos de Firebase.</p>
                </div>
            `;
        });

        // Render Cards
        function renderProjects() {
            const searchTerm = searchInput.value.toLowerCase();
            const filtered = currentProjects.filter(p => {
                const matchesSearch = p.title.toLowerCase().includes(searchTerm) || (p.description && p.description.toLowerCase().includes(searchTerm));
                const matchesFilter = activeFilter === 'all' || p.status === activeFilter;
                return matchesSearch && matchesFilter;
            });

            if (filtered.length === 0) {
                projectsContainer.innerHTML = `
                    <div class="col-span-full py-16 text-center border border-dashed border-darkborder rounded-2xl">
                        <i class="fa-solid fa-folder-open text-4xl text-gray-500 mb-3"></i>
                        <p class="text-gray-400 text-sm">No hay proyectos registrados o coincidentes.</p>
                    </div>
                `;
                return;
            }

            projectsContainer.innerHTML = filtered.map(project => {
                const badgeColor = project.status === 'Completado' 
                    ? 'border-neonGreen/40 text-neonGreen bg-neonGreen/10' 
                    : project.status === 'En Proceso' 
                    ? 'border-neonViolet/40 text-neonViolet bg-neonViolet/10' 
                    : 'border-yellow-500/40 text-yellow-400 bg-yellow-500/10';

                return `
                    <div class="bg-darkcard border border-darkborder hover:border-gray-700 rounded-2xl overflow-hidden flex flex-col transition-all hover:shadow-lg group">
                        ${project.imageUrl ? `
                            <div class="h-44 w-full overflow-hidden relative">
                                <img src="${project.imageUrl}" alt="${project.title}" class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-300">
                            </div>
                        ` : ''}
                        
                        <div class="p-5 flex-1 flex flex-col justify-between">
                            <div>
                                <div class="flex items-center justify-between gap-2 mb-2">
                                    <span class="text-[10px] uppercase tracking-wider font-bold px-2 py-0.5 rounded border ${badgeColor}">
                                        ${project.status}
                                    </span>
                                    <button onclick="deleteProject('${project.id}')" title="Eliminar" class="text-gray-500 hover:text-red-400 text-xs transition-colors p-1">
                                        <i class="fa-solid fa-trash-can"></i>
                                    </button>
                                </div>

                                <h3 class="font-bold text-white text-lg mb-2 line-clamp-1">${project.title}</h3>

                                ${project.description ? `
                                    <p class="text-gray-400 text-xs leading-relaxed mb-4 line-clamp-3">${project.description}</p>
                                ` : ''}
                            </div>

                            ${project.fileUrl ? `
                                <div class="pt-3 border-t border-darkborder mt-2">
                                    <a href="${project.fileUrl}" target="_blank" rel="noopener noreferrer" class="inline-flex items-center gap-2 text-xs text-neonGreen hover:underline font-medium">
                                        <i class="fa-solid fa-paperclip"></i> Ver archivo adjunto
                                    </a>
                                </div>
                            ` : ''}
                        </div><!DOCTYPE html>

                        <input type="file" id="imageFileInput" accept="image/*" class="hidden">
                        <button type="button" id="triggerFileBtn" class="flex-1 bg-darkbg border border-dashed border-darkborder hover:border-neonViolet rounded-xl py-2 px-3 text-xs text-gray-300 flex items-center justify-center gap-2 transition-colors">
                            <i class="fa-solid fa-upload text-neonViolet"></i> Subir imagen local
                        </button>
                    </div>
                    <input type="url" id="projectImageUrl" placeholder="O pega el link de una imagen (https://...)" class="w-full bg-darkbg border border-darkborder rounded-xl px-3 py-2 text-sm text-white focus:outline-none focus:border-neonGreen transition-colors">
                    <div id="imagePreviewContainer" class="mt-2 hidden">
                        <img id="imagePreview" class="h-28 w-full object-cover rounded-lg border border-darkborder">
                    </div>
                </div>

                <div>
                    <label class="block text-xs font-medium text-gray-300 mb-1">Enlace a Archivo / Documento Externo</label>
                    <div class="relative">
                        <i class="fa-solid fa-link absolute left-3 top-1/2 -translate-y-1/2 text-gray-400 text-xs"></i>
                        <input type="url" id="projectFileUrl" placeholder="https://drive.google.com/..." class="w-full bg-darkbg border border-darkborder rounded-xl pl-9 pr-3 py-2 text-sm text-white focus:outline-none focus:border-neonGreen transition-colors">
                    </div>
                </div>

                <div class="pt-2 flex justify-end gap-3">
                    <button type="button" id="cancelModalBtn" class="px-4 py-2 rounded-xl border border-darkborder text-xs text-gray-300 hover:bg-darkbg transition-colors">Cancelar</button>
                    <button type="submit" id="saveProjectBtn" class="px-5 py-2 rounded-xl bg-neonViolet text-white font-semibold text-xs hover:bg-neonVioletHover shadow-neon-violet transition-all flex items-center gap-2">
                        <i class="fa-solid fa-floppy-disk"></i> Guardar Proyecto
                    </button>
                </div>
            </form>
        </div>
    </div>

    <!-- WhatsApp Floating Button -->
    <a href="https://wa.me/573213754963?text=Hola%20Smith,%20vengo%20desde%20tu%20lista%20de%20proyectos." target="_blank" rel="noopener noreferrer" title="Contactar por WhatsApp" class="fixed bottom-6 right-6 z-40 bg-[#25D366] hover:bg-[#20ba5a] text-white p-3.5 rounded-full shadow-lg hover:scale-110 transition-all duration-300 flex items-center justify-center border-2 border-white/20 group">
        <i class="fa-brands fa-whatsapp text-2xl"></i>
        <span class="max-w-0 overflow-hidden whitespace-nowrap group-hover:max-w-xs transition-all duration-500 ease-in-out text-xs font-bold pl-0 group-hover:pl-2">WhatsApp</span>
    </a>

    <!-- Firebase App Modules -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, collection, addDoc, onSnapshot, deleteDoc, doc, updateDoc, serverTimestamp, query, orderBy } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        // Configuración Firebase Demo (Funcional)
        const firebaseConfig = {
            apiKey: "AIzaSyDemoKeyOnlyForPublicCanvasApp123",
            authDomain: "smith-rincon-proyectos.firebaseapp.com",
            projectId: "smith-rincon-proyectos",
            storageBucket: "smith-rincon-proyectos.appspot.com",
            messagingSenderId: "1234567890",
            appId: "1:1234567890:web:abcdef123456"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const projectsRef = collection(db, "projects");

        // UI Elements
        const modal = document.getElementById('projectModal');
        const openModalBtn = document.getElementById('openModalBtn');
        const closeModalBtn = document.getElementById('closeModalBtn');
        const cancelModalBtn = document.getElementById('cancelModalBtn');
        const projectForm = document.getElementById('projectForm');
        const projectsContainer = document.getElementById('projectsContainer');
        const triggerFileBtn = document.getElementById('triggerFileBtn');
        const imageFileInput = document.getElementById('imageFileInput');
        const projectImageUrl = document.getElementById('projectImageUrl');
        const imagePreviewContainer = document.getElementById('imagePreviewContainer');
        const imagePreview = document.getElementById('imagePreview');
        const searchInput = document.getElementById('searchInput');
        const filterBtns = document.querySelectorAll('.filter-btn');

        let currentProjects = [];
        let activeFilter = 'all';
        let base64Image = '';

        // Open/Close Modal
        openModalBtn.addEventListener('click', () => {
            projectForm.reset();
            base64Image = '';
            imagePreviewContainer.classList.add('hidden');
            modal.classList.remove('hidden');
        });

        const closeModal = () => modal.classList.add('hidden');
        closeModalBtn.addEventListener('click', closeModal);
        cancelModalBtn.addEventListener('click', closeModal);

        // Image Handling
        triggerFileBtn.addEventListener('click', () => imageFileInput.click());

        imageFileInput.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(event) {
                    base64Image = event.target.result;
                    projectImageUrl.value = '';
                    imagePreview.src = base64Image;
                    imagePreviewContainer.classList.remove('hidden');
                };
                reader.readAsDataURL(file);
            }
        });

        projectImageUrl.addEventListener('input', (e) => {
            const url = e.target.value.trim();
            if (url) {
                base64Image = '';
                imagePreview.src = url;
                imagePreviewContainer.classList.remove('hidden');
            } else {
                imagePreviewContainer.classList.add('hidden');
            }
        });

        // Save Project to Firebase
        projectForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const submitBtn = document.getElementById('saveProjectBtn');
            submitBtn.disabled = true;
            submitBtn.innerHTML = `<i class="fa-solid fa-spinner fa-spin"></i> Guardando...`;

            const title = document.getElementById('projectTitle').value.trim();
            const status = document.getElementById('projectStatus').value;
            const description = document.getElementById('projectDescription').value.trim();
            const imageUrl = base64Image || document.getElementById('projectImageUrl').value.trim();
            const fileUrl = document.getElementById('projectFileUrl').value.trim();

            try {
                await addDoc(projectsRef, {
                    title,
                    status,
                    description,
                    imageUrl,
                    fileUrl,
                    createdAt: serverTimestamp()
                });
                closeModal();
            } catch (err) {
                console.error("Error guardando proyecto:", err);
                alert("Ocurrió un problema al conectar con Firebase. Verifique la consola.");
            } finally {
                submitBtn.disabled = false;
                submitBtn.innerHTML = `<i class="fa-solid fa-floppy-disk"></i> Guardar Proyecto`;
            }
        });

        // Realtime Listener
        const q = query(projectsRef, orderBy("createdAt", "desc"));
        onSnapshot(q, (snapshot) => {
            currentProjects = snapshot.docs.map(doc => ({
                id: doc.id,
                ...doc.data()
            }));
            renderProjects();
        }, (error) => {
            console.error("Error en tiempo real de Firestore:", error);
            document.getElementById('loadingState').innerHTML = `
                <div class="text-red-400">
                    <i class="fa-solid fa-triangle-exclamation text-3xl mb-2"></i>
                    <p>Error de conexión con la base de datos de Firebase.</p>
                </div>
            `;
        });

        // Render Cards
        function renderProjects() {
            const searchTerm = searchInput.value.toLowerCase();
            const filtered = currentProjects.filter(p => {
                const matchesSearch = p.title.toLowerCase().includes(searchTerm) || (p.description && p.description.toLowerCase().includes(searchTerm));
                const matchesFilter = activeFilter === 'all' || p.status === activeFilter;
                return matchesSearch && matchesFilter;
            });

            if (filtered.length === 0) {
                projectsContainer.innerHTML = `
                    <div class="col-span-full py-16 text-center border border-dashed border-darkborder rounded-2xl">
                        <i class="fa-solid fa-folder-open text-4xl text-gray-500 mb-3"></i>
                        <p class="text-gray-400 text-sm">No hay proyectos registrados o coincidentes.</p>
                    </div>
                `;
                return;
            }

            projectsContainer.innerHTML = filtered.map(project => {
                const badgeColor = project.status === 'Completado' 
                    ? 'border-neonGreen/40 text-neonGreen bg-neonGreen/10' 
                    : project.status === 'En Proceso' 
                    ? 'border-neonViolet/40 text-neonViolet bg-neonViolet/10' 
                    : 'border-yellow-500/40 text-yellow-400 bg-yellow-500/10';

                return `
                    <div class="bg-darkcard border border-darkborder hover:border-gray-700 rounded-2xl overflow-hidden flex flex-col transition-all hover:shadow-lg group">
                        ${project.imageUrl ? `
                            <div class="h-44 w-full overflow-hidden relative">
                                <img src="${project.imageUrl}" alt="${project.title}" class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-300">
                            </div>
                        ` : ''}
                        
                        <div class="p-5 flex-1 flex flex-col justify-between">
                            <div>
                                <div class="flex items-center justify-between gap-2 mb-2">
                                    <span class="text-[10px] uppercase tracking-wider font-bold px-2 py-0.5 rounded border ${badgeColor}">
                                        ${project.status}
                                    </span>
                                    <button onclick="deleteProject('${project.id}')" title="Eliminar" class="text-gray-500 hover:text-red-400 text-xs transition-colors p-1">
                                        <i class="fa-solid fa-trash-can"></i>
                                    </button>
                                </div>

                                <h3 class="font-bold text-white text-lg mb-2 line-clamp-1">${project.title}</h3>

                                ${project.description ? `
                                    <p class="text-gray-400 text-xs leading-relaxed mb-4 line-clamp-3">${project.description}</p>
                                ` : ''}
                            </div>

                            ${project.fileUrl ? `
                                <div class="pt-3 border-t border-darkborder mt-2">
                                    <a href="${project.fileUrl}" target="_blank" rel="noopener noreferrer" class="inline-flex items-center gap-2 text-xs text-neonGreen hover:underline font-medium">
                                        <i class="fa-solid fa-paperclip"></i> Ver archivo adjunto
                                    </a>
                                </div>
                            ` : ''}
                        </div>
                    </div>
                `;
            }).join('');
        }

        // Delete Function Global Expose
        window.deleteProject = async (id) => {
            if (confirm("¿Seguro que deseas eliminar este proyecto de Firebase?")) {
                await deleteDoc(doc(db, "projects", id));
            }
        };

        // Search & Filter Events
        searchInput.addEventListener('input', renderProjects);

        filterBtns.forEach(btn => {
            btn.addEventListener('click', () => {
                filterBtns.forEach(b => {
                    b.classList.remove('active', 'border-neonGreen', 'text-neonGreen', 'bg-neonGreen/10');
                    b.classList.add('border-darkborder', 'text-gray-400');
                });
                btn.classList.add('active', 'border-neonGreen', 'text-neonGreen', 'bg-neonGreen/10');
                btn.classList.remove('border-darkborder', 'text-gray-400');
                
                activeFilter = btn.dataset.filter;
                renderProjects();
            });
        });
    </script>
</body>
</html>
